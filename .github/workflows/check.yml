name: Validate V2 package

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - run: npm run check
