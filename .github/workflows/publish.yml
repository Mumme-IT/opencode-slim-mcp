name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: |
          npm install --global npm@latest
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

      - name: Validate native V2 package
        run: npm run check

      - name: Require explicit approval for this release
        env:
          RELEASE_ACCEPTED_VERSION: ${{ vars.SLIM_MCP_RELEASE_ACCEPTED_VERSION }}
        run: |
          if [ "${RELEASE_ACCEPTED_VERSION}" != "$(node -p 'require("./package.json").version')" ]; then
            echo "This version requires explicit release approval. See docs/implementation.md."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
